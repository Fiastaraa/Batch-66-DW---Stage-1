<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Project - Fiastara Seikha Arthanev</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark sticky-top" style="background-color: #95292D;">
            <div class="container">
                <a class="navbar-brand" href="index.html">
                    <img src="img/logo.jpg" alt="Logo Fiastara" class="logo-img">
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="index.html#hero">Home</a></li>
                        <li class="nav-item"><a class="nav-link" href="index.html#projects">Projects</a></li>
                        <li class="nav-item"><a class="nav-link" href="index.html#portfolio">Portfolio</a></li>
                        <li class="nav-item"><a class="nav-link" href="index.html#contact">Contact</a></li>
                        <li class="nav-item"><a class="nav-link active" href="addproject.html">Add Project</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="py-5 add-project-section">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="bg-light rounded shadow p-4">
                        <h2 class="mb-4" style="color: #95292D;">Add New Project</h2>
                        <div id="formError" class="alert alert-danger d-none"></div>
                        <form id="projectForm" novalidate>
                            <div class="mb-3">
                                <label for="projectName" class="form-label">Project Name *</label>
                                <input type="text" class="form-control" id="projectName" placeholder="Enter project name">
                            </div>
                            <div class="row g-3 mb-3">
                                <div class="col-md-6">
                                    <label for="projectStartDate" class="form-label">Start Date *</label>
                                    <input type="date" class="form-control" id="projectStartDate">
                                </div>
                                <div class="col-md-6">
                                    <label for="projectEndDate" class="form-label">End Date *</label>
                                    <input type="date" class="form-control" id="projectEndDate">
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="projectDescription" class="form-label">Description *</label>
                                <textarea class="form-control" id="projectDescription" rows="5" placeholder="Describe the project"></textarea>
                            </div>
                            <div class="mb-3">
                                <label for="projectCategory" class="form-label">Category *</label>
                                <select id="projectCategory" class="form-select">
                                    <option value="Web Development">Web Development</option>
                                    <option value="Mobile App">Mobile App</option>
                                    <option value="UI/UX Design">UI/UX Design</option>
                                    <option value="Data Science">Data Science</option>
                                    <option value="Other">Other</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Technologies *</label>
                                <div class="row">
                                    <div class="col-6 col-md-4 mb-2">
                                        <div class="form-check">
                                            <input class="form-check-input tech-checkbox" type="checkbox" value="HTML" id="techHTML">
                                            <label class="form-check-label" for="techHTML">HTML</label>
                                        </div>
                                    </div>
                                    <div class="col-6 col-md-4 mb-2">
                                        <div class="form-check">
                                            <input class="form-check-input tech-checkbox" type="checkbox" value="CSS" id="techCSS">
                                            <label class="form-check-label" for="techCSS">CSS</label>
                                        </div>
                                    </div>
                                    <div class="col-6 col-md-4 mb-2">
                                        <div class="form-check">
                                            <input class="form-check-input tech-checkbox" type="checkbox" value="JavaScript" id="techJS">
                                            <label class="form-check-label" for="techJS">JavaScript</label>
                                        </div>
                                    </div>
                                    <div class="col-6 col-md-4 mb-2">
                                        <div class="form-check">
                                            <input class="form-check-input tech-checkbox" type="checkbox" value="Bootstrap" id="techBootstrap">
                                            <label class="form-check-label" for="techBootstrap">Bootstrap</label>
                                        </div>
                                    </div>
                                    <div class="col-6 col-md-4 mb-2">
                                        <div class="form-check">
                                            <input class="form-check-input tech-checkbox" type="checkbox" value="Figma" id="techFigma">
                                            <label class="form-check-label" for="techFigma">Figma</label>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="mb-4">
                                <label for="projectImage" class="form-label">Upload Project Image *</label>
                                <input class="form-control" type="file" id="projectImage" accept="image/*">
                            </div>
                            <div class="d-flex gap-3 flex-wrap">
                                <button type="submit" class="btn btn-primary">Save Project</button>
                                <a href="index.html" class="btn btn-outline-secondary">Back to Home</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="text-center py-3 bg-dark text-light">
        <p>&copy; 2026 Fiastara Seikha Arthanev. All rights reserved.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
